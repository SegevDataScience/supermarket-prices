# Family page (GitHub Pages).
# The home PC builds the whole site every 3 days (price data for the chosen areas + the saved lists;
# all chains answer from Israel) and force-pushes it to the "pages" branch, then touches
# family/last_publish.txt on main; this workflow (running from main) publishes the "pages" branch as is. Prices on the page always show their date.
name: Family page

on:
  push:                      # the PC updates family/last_publish.txt on main right after pushing "pages"
    branches: [main]
    paths: ["family/last_publish.txt", ".github/workflows/family-page.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - name: Remove repository files from the site
        run: rm -rf .git .github
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
