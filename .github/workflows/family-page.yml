# Family page (GitHub Pages).
# Normally the home PC builds the FULL page every morning (all chains answer from Israel) and pushes it
# to published/; this workflow then publishes it as is. If no page from today arrived by 09:00, it
# builds a PARTIAL page here (several chains' price sites don't answer servers outside Israel) with a
# clear notice. The lists and the home address come from the secret FAMILY_CONFIG; the page shows no address.
name: Family page

on:
  schedule:
    - cron: "0 7 * * *"    # 07:00 UTC = 09:00 Israel (winter) / 10:00 (summer): fallback if the PC didn't publish
  workflow_dispatch: {}    # "Run workflow" button
  push:                    # the PC's daily page, product decisions or page code
    branches: [main]
    paths:
      - "published/**"
      - "family/**"
      - "app.py"
      - "fresh_prices.py"
      - "ext/**"
      - ".github/workflows/family-page.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Jerusalem
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Use the PC's full page if it is from today
        id: pc
        run: |
          if [ -f published/stamp.json ] && python3 -c "import json,datetime,sys; d=json.load(open('published/stamp.json')); sys.exit(0 if d.get('date')==datetime.date.today().isoformat() else 1)"; then
            mkdir -p site && cp -r published/. site/ && rm -f site/stamp.json
            echo "fresh=1" >> "$GITHUB_OUTPUT"
            echo "Publishing the full page built on the PC today."
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
            echo "No page from the PC today: building a partial page here."
          fi

      - if: steps.pc.outputs.fresh != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.pc.outputs.fresh != '1'
        name: Install requirements
        run: pip install requests

      - if: steps.pc.outputs.fresh != '1'
        name: Restore geocoding cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/il-supermarkets/geocode.json
            ~/.cache/il-supermarkets/cities-*.json
            .il-supermarket-work/geocode_ui.json
          key: geo-${{ github.run_id }}
          restore-keys: geo-

      - if: steps.pc.outputs.fresh != '1'
        name: Build a partial page (cloud)
        env:
          FAMILY_CONFIG: ${{ secrets.FAMILY_CONFIG }}
        run: python family/daily_page.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
