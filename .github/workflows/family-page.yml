# Every morning: run the price comparison for the family lists and publish the page (GitHub Pages).
# The lists and the home address come from the repository secret FAMILY_CONFIG (never committed);
# the page shows no address.
name: Family page

on:
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC = 06:15 Israel (winter) / 07:15 (summer)
  workflow_dispatch: {}    # "Run workflow" button for an update on demand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Jerusalem
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      # Geocoding results are cached between runs (polite to OpenStreetMap, and faster).
      - name: Restore geocoding cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/il-supermarkets/geocode.json
            ~/.cache/il-supermarkets/cities-*.json
            .il-supermarket-work/geocode_ui.json
          key: geo-${{ github.run_id }}
          restore-keys: geo-

      - name: Build the page
        env:
          FAMILY_CONFIG: ${{ secrets.FAMILY_CONFIG }}
        run: python family/daily_page.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
